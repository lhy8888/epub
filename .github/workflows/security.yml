name: CodeQL security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '19 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            os: windows-latest
            build-mode: manual
          - language: actions
            os: ubuntu-latest
            build-mode: none
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET for C# analysis
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Initialize security and quality query suites
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Build all C# source for analysis
        if: matrix.language == 'csharp'
        run: dotnet build QuietRead.sln --configuration Release --no-incremental -p:UseSharedCompilation=false -p:RestoreLockedMode=true
      - name: Analyze and upload results to the Security tab
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: '/language:${{ matrix.language }}'

  security-checks:
    name: All security scans
    if: always()
    needs: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.codeql.result }}
        run: test "$RESULT" = success
